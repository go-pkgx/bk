name: Release

# bk had no release workflow while pkgx, pkgm and mirror did, so its tags ran
# ahead of its Releases page: v0.7.0 tagged, v0.5.0 the newest release anybody
# browsing the repository could see. Go resolves a module by TAG, so nothing
# was broken for a consumer who imports bk — and everything was wrong for a
# person who wanted the binary.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.7.0). Must already exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, and it is not caution. Go stamps a binary's module
      # version from the VCS state it builds in, which is what makes
      # `bk lock` able to record WHICH bk wrote a lock. A shallow checkout
      # can leave the tag unreachable and the stamp becomes a pseudo-version,
      # so the release would ship binaries that misreport themselves.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            git checkout "$tag"
          else
            tag="$REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The same targets ci.yml builds, so a release cannot carry a platform
      # the matrix never compiled. Six linux arches because the factory runs
      # on all of them -- s390x, ppc64le, riscv64 and loong64 are not
      # curiosities here, they are lanes with bottles.
      # ⛔ dist/ MUST NOT LIVE IN THE CHECKOUT. Go stamps the main module
      # from the work tree's VCS state, so the moment the first binary lands
      # in an untracked dist/ the tree is dirty and every LATER build in this
      # loop is stamped `+dirty`.
      #
      # An EMPTY directory is invisible to git, so `mkdir dist` alone is
      # harmless — it is the first `-o dist/...` that does it. Which is why
      # the FIRST target of the loop comes out clean and the other thirteen
      # do not. See the guard below for what that cost.
      - name: Build release binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"
          for target in \
            linux/amd64 linux/arm64 linux/riscv64 \
            linux/ppc64le linux/s390x linux/loong64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 \
            freebsd/amd64 freebsd/arm64 netbsd/amd64 openbsd/amd64; do
            os=${target%/*}
            arch=${target#*/}
            out="bk-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$DIST/${out}" ./cmd/bk
          done
          cd "$DIST"
          sha256sum bk-* > SHA256SUMS
          cat SHA256SUMS

      # An ASSERTION, not a hope. bk writes its own module version into every
      # lock it produces (`bk = "v0.7.0"`), read from debug.ReadBuildInfo, and
      # a binary whose stamp does not match the tag would put a lie in every
      # lock taken with it. Measured before this workflow was written: a clean
      # build at a tagged commit stamps the tag, and a dirty tree stamps
      # `v0.6.2-0.2026…+dirty` instead -- so this can fail, and when it does
      # the fix is -ldflags "-X", not a shrug.
      #
      # `go version -m` is the same idiom go-pkgx/packages already uses to
      # record which bk built a bottle.
      # ⛔⛔ THE BINARIES. PLURAL. This step was already an EXACT equality,
      # and it passed for thirteen releases while shipping dirty binaries,
      # because of WHICH FILE it read:
      #
      #   bk-linux-amd64    v0.14.8          ← the one it checked
      #   bk-linux-arm64    v0.14.8+dirty
      #   bk-darwin-arm64   v0.14.8+dirty
      #   bk-linux-s390x    v0.14.8+dirty
      #
      # bk-linux-amd64 is the FIRST target of the loop above — built before
      # anything had been written into dist/, so it is the only one of the
      # fourteen that could never be dirty. The assertion was right, the
      # sample was the one that cannot show the defect.
      #
      # Measured 2026-10-09 on the published v0.14.8 assets, after a peer
      # session reported the same shape in go-authn.
      - name: The binaries must say which version they are
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          DIST="$RUNNER_TEMP/dist"
          bad=0
          for bin in "$DIST"/bk-*; do
            name=$(basename "$bin")
            info=$(go version -m "$bin")
            stamped=$(printf '%s\n' "$info" | awk '$1=="mod" {print $3; exit}')
            echo "$name: $stamped"
            if [ "$stamped" != "$TAG" ]; then
              echo "::error::$name stamps $stamped but this is $TAG — every lock written by this build would name the wrong bk"
              bad=1
            fi
            if printf '%s\n' "$info" | grep -q 'vcs\.modified=true'; then
              echo "::error::$name: vcs.modified=true — it was built from a dirty tree"
              bad=1
            fi
          done
          exit "$bad"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          DIST="$RUNNER_TEMP/dist"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIST"/* --clobber
          else
            gh release create "$TAG" "$DIST"/* \
              --title "$TAG" \
              --notes "Static, dependency-free \`bk\` binaries (CGO_ENABLED=0) for six linux architectures, darwin, windows and the BSDs. Verify downloads against SHA256SUMS. Each binary reports its own version into every \`bk lock\` it writes."
          fi
