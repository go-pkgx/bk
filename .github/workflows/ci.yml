name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  # ⛔ NOTHING HERE HAD EVER ASKED. Scanned by hand on 2026-10-18, with the
  # toolchain the `go` directive then permitted — go1.27.1 — this module had
  # 22 findings, EIGHT of them reachable:
  #
  #   GO-2026-6605 stdlib.Get           GO-2026-6617 stdlib.RoundTrip
  #   GO-2026-6611 stdlib.Read          GO-2026-6610 stdlib.NewClientConn
  #   GO-2026-6613 stdlib.Read          GO-2026-6608 stdlib.ReadMIMEHeader
  #   GO-2026-6603 stdlib.Close         GO-2026-6607 stdlib.DialContext
  #
  # Reachable, not merely present: bk fetches tarballs and talks to a
  # registry, so those are its own HTTP paths.
  #
  # ⛔ AND THE `go` DIRECTIVE IS THE TOOLCHAIN. This lane always pinned
  # go-version 1.27.2, so what CI built was never vulnerable — but `go install
  # github.com/go-pkgx/bk/cmd/bk@main` builds with the user's toolchain, and a
  # directive of 1.27.1 let 1.27.1 do it. Raising the directive is what forces
  # every builder, here and on a laptop, onto the fixed standard library.
  # Measured on a copy before the change was made: 22 findings at 1.27.1, 6 at
  # 1.27.2, 1 once golang.org/x/net went to v0.60.0 — and that last one is a
  # notice with no released fix.
  vuln:
    name: govulncheck, judged by vulngate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      # ⛔ NO `set -o pipefail` and no bare exit status: govulncheck exits
      # non-zero over findings it has decided are NOT called, and zero over
      # some it has, which is the whole reason vulngate exists. The emptiness
      # check is the other half — a scan that wrote nothing must not read as
      # nothing found.
      #
      # The scanner is @latest and the judge is pinned, on purpose: the
      # scanner should know about an advisory published this morning, while
      # the verdict should not change under the repository without a commit.
      - name: govulncheck, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.23.0
          BIN="$(go env GOPATH)/bin"
          "$BIN/govulncheck" -format json ./... > "$RUNNER_TEMP/vuln.json" || true
          test -s "$RUNNER_TEMP/vuln.json" || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          "$BIN/vulngate" -go "$(go env GOVERSION)" "$RUNNER_TEMP/vuln.json"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # -race, because a concurrency guard that cannot fire is not a guard.
      # tailWriter took a whole darwin/x86-64 factory run down with
      #   panic: runtime error: slice bounds out of range [43:0]
      # and the test written for it passed here either way until this flag
      # existed: without -race the corruption is a matter of luck, and CI's
      # luck was good. The whole suite is clean under it today, so this costs
      # runtime and nothing else.
      - name: test + 100% coverage gate
        run: |
          go test ./... -race -covermode=atomic -coverprofile=cov.out
          total=$(go tool cover -func=cov.out | awk '/^total:/{print $3}')
          echo "total coverage: $total"
          # Count uncovered BLOCKS. This used to compare $total against the
          # string "100.0%", and `go tool cover -func` rounds to one decimal,
          # so the gate's real threshold was 99.95%. Two lines in fixup lived
          # under it -- the package printed 99.8% on a green main -- and were
          # only reported when a third arrived and tipped the rounding to
          # 99.9%. A gate named "100% coverage" should not have a tolerance
          # nobody chose, sized by the codebase.
          #
          # The per-function listing below is rounded the same way, so it is
          # kept for reading and not for deciding.
          uncovered=$(awk 'NR>1 && $NF==0' cov.out | wc -l | tr -d ' ')
          if [ "$uncovered" != "0" ]; then
            echo "$uncovered uncovered block(s)"
            go tool cover -func=cov.out | awk '$3!="100.0%"'
            echo "== uncovered blocks =="; awk 'NR>1 && $NF==0' cov.out
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: riscv64 }
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x }
          - { goos: linux,   goarch: loong64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          - { goos: netbsd,  goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }} (CGO=0)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  darwin:
    name: test (macOS, where the signature is judged)
    runs-on: macos-26
    # bk rewrites Mach-O load commands, and an edited Mach-O whose signature
    # still describes the old bytes is not slow or subtly wrong: the arm64
    # kernel kills it on sight, with no message and an empty stdout. Only macOS
    # can rule on the signature we recompute, and only its kernel can rule on
    # whether the binary still runs — so the test that asks them both is
    # compiled out on ubuntu, and would never run at all without this job.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      # -count=1: a cached PASS from another job must not stand in for a run
      # that never happened on this platform.
      - run: go test -count=1 ./...

  freebsd:
    name: test (FreeBSD, a kernel that is not Linux)
    runs-on: ubuntu-latest
    # The qemu lanes vary the ARCHITECTURE and hold the OS fixed. These three do
    # the opposite: same amd64, a different kernel and a different libc. The
    # bugs it can see are the ones neither a compiler nor a big-endian machine
    # can — a syscall that behaves differently, a /proc that is not there, an
    # exec or a rename whose edges are not Linux's.
    #
    # The toolchain never enters the VM: bk's go.mod names a Go version no BSD
    # package set carries, and a lane that installed one would depend on what a
    # package mirror happens to hold today. Same idiom as the qemu lanes —
    # build here, run there — with the VM supplying only a kernel and a libc,
    # which is the whole point.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build freebsd
      # Pinned by commit, not by tag: a tag can be moved onto code we never read.
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run

  netbsd:
    name: test (NetBSD, a kernel that is not Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build netbsd
      - uses: vmactions/netbsd-vm@7f23a491dcc69c34195721ab67934917707f84c7
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run

  openbsd:
    name: test (OpenBSD, the strictest kernel we can reach)
    runs-on: ubuntu-latest
    # OpenBSD is the one most likely to find something: W^X is enforced, malloc
    # is deliberately hostile (junk-filling, guard pages), and syscall origin is
    # policed. Code that merely happens to work elsewhere tends to stop here.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build openbsd
      - uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run

  emulated:
    name: test (${{ matrix.goarch }}, qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            qemu: qemu-aarch64-static
          - goarch: riscv64
            qemu: qemu-riscv64-static
          - goarch: ppc64le
            qemu: qemu-ppc64le-static
          - goarch: s390x
            qemu: qemu-s390x-static
          - goarch: loong64
            qemu: qemu-loongarch64-static
    # Cross-COMPILING proves the code builds for an architecture. It says
    # nothing about whether it WORKS there, and the bugs a compiler cannot see
    # are exactly the interesting ones: a byte order read from the host rather
    # than from the format, an assumption about int width, a struct laid out
    # differently.
    #
    # s390x is here because it is BIG-ENDIAN and nothing else we run is.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          # Named, not assumed: a missing emulator must report itself as a
          # missing tool rather than as a failure on that architecture.
          command -v ${{ matrix.qemu }} || {
            echo "::error::${{ matrix.qemu }} is not in this image" >&2; exit 1; }
      - name: go test
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
        # -count=1 so a cached PASS from the host architecture cannot stand in
        # for a run that never happened under emulation.
        run: go test -count=1 -exec ${{ matrix.qemu }} ./...
