name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: test + 100% coverage gate
        run: |
          go test ./... -covermode=atomic -coverprofile=cov.out
          total=$(go tool cover -func=cov.out | awk '/^total:/{print $3}')
          echo "total coverage: $total"
          if [ "$total" != "100.0%" ]; then
            echo "coverage below 100%"; go tool cover -func=cov.out | awk '$3!="100.0%"'
            echo "== uncovered blocks =="; awk 'NR>1 && $NF==0' cov.out
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: riscv64 }
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x }
          - { goos: linux,   goarch: loong64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }} (CGO=0)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  emulated:
    name: test (${{ matrix.goarch }}, qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            qemu: qemu-aarch64-static
          - goarch: riscv64
            qemu: qemu-riscv64-static
          - goarch: ppc64le
            qemu: qemu-ppc64le-static
          - goarch: s390x
            qemu: qemu-s390x-static
          - goarch: loong64
            qemu: qemu-loongarch64-static
    # Cross-COMPILING proves the code builds for an architecture. It says
    # nothing about whether it WORKS there, and the bugs a compiler cannot see
    # are exactly the interesting ones: a byte order read from the host rather
    # than from the format, an assumption about int width, a struct laid out
    # differently.
    #
    # s390x is here because it is BIG-ENDIAN and nothing else we run is.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          # Named, not assumed: a missing emulator must report itself as a
          # missing tool rather than as a failure on that architecture.
          command -v ${{ matrix.qemu }} || {
            echo "::error::${{ matrix.qemu }} is not in this image" >&2; exit 1; }
      - name: go test
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
        # -count=1 so a cached PASS from the host architecture cannot stand in
        # for a run that never happened under emulation.
        run: go test -count=1 -exec ${{ matrix.qemu }} ./...
